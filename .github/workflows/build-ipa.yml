name: Build ARTEXX iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      signing:
        description: "Use signing certificate from Secrets (otherwise unsigned ipa)"
        type: boolean
        default: false

jobs:
  build:
    # public repo: macOS runners are free & unmetered
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build Go backend (libartex.a)
        run: bash backend/go/build-go.sh

      - name: Generate skills SKILL.md tree (bundled)
        run: node scripts/skills-json-to-dirs.mjs

      - name: Generate Xcode project (links libartex.a)
        run: node scripts/gen-xcodeproj.mjs

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version
          echo "--- Go archive ---"
          ls -lh ios/ARTEXX/Go/ || true
          echo "--- bundled resources ---"
          ls -lh ios/ARTEXX/Resources/ || true

      - name: Verify bundled knowledge base
        run: python3 scripts/verify_assets.py

      - name: Build (unsigned)
        if: ${{ !inputs.signing }}
        run: |
          set -o pipefail
          cd ios
          xcodebuild build \
            -project ARTEXX.xcodeproj \
            -scheme ARTEXX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            | tee build.log | tail -80

      - name: Build (signed)
        if: ${{ inputs.signing }}
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/cert.p12
          echo "$PROVISION_PROFILE" | base64 -d > /tmp/profile.mobileprovision
          KEYCHAIN=/tmp/build.keychain-db
          security create-keychain -p "build" $KEYCHAIN
          security set-keychain-settings -lut 3600 $KEYCHAIN
          security unlock-keychain -p "build" $KEYCHAIN
          security import /tmp/cert.p12 -k $KEYCHAIN -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cd ios
          xcodebuild build \
            -project ARTEXX.xcodeproj \
            -scheme ARTEXX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -allowProvisioningUpdates \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            | tee build.log | tail -80

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=ios/build/Build/Products/Release-iphoneos/ARTEXX.app
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ARTEXX-unsigned.ipa Payload
          ls -lh ARTEXX-unsigned.ipa
          unzip -l ARTEXX-unsigned.ipa | head -25

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ARTEXX-ipa
          path: ARTEXX-unsigned.ipa
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
