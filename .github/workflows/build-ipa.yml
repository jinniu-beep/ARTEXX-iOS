name: Build ARTEXX iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      signing:
        description: "是否用 Secrets 里的证书签名（否则产出未签名 ipa）"
        type: boolean
        default: false

jobs:
  build:
    # 免费额度：public 仓库 macOS runner 不限量；private 仓库按分钟计费
    runs-on: macos-13
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 环境信息
        run: |
          xcodebuild -version
          swift --version
          echo "--- 资源 ---"
          ls -lh ios/ARTEXX/Resources/ || true

      - name: 校验内置知识库
        run: python3 scripts/verify_assets.py

      - name: 未签名构建（默认）
        if: ${{ !inputs.signing }}
        run: |
          set -o pipefail
          cd ios
          xcodebuild build             -project ARTEXX.xcodeproj             -scheme ARTEXX             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             CODE_SIGN_ENTITLEMENTS=""             DEVELOPMENT_TEAM=""             ONLY_ACTIVE_ARCH=NO             | tee build.log | tail -60

      - name: 签名构建（自定义证书）
        if: ${{ inputs.signing }}
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
          PROVISION_PROFILE: ${{ secrets.PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          set -euo pipefail
          echo "$BUILD_CERT_P12" | base64 -d > /tmp/cert.p12
          echo "$PROVISION_PROFILE" | base64 -d > /tmp/profile.mobileprovision
          KEYCHAIN=/tmp/build.keychain-db
          security create-keychain -p "build" $KEYCHAIN
          security set-keychain-settings -lut 3600 $KEYCHAIN
          security unlock-keychain -p "build" $KEYCHAIN
          security import /tmp/cert.p12 -k $KEYCHAIN -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN login.keychain-db
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          cd ios
          xcodebuild build             -project ARTEXX.xcodeproj             -scheme ARTEXX             -configuration Release             -sdk iphoneos             -derivedDataPath build             -allowProvisioningUpdates             PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}"             DEVELOPMENT_TEAM="${TEAM_ID}"             CODE_SIGN_STYLE=Manual             | tee build.log | tail -60

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP_PATH=ios/build/Build/Products/Release-iphoneos/ARTEXX.app
          test -d "$APP_PATH"
          rm -rf Payload && mkdir Payload
          cp -R "$APP_PATH" Payload/
          # 未签名构建补一个空的 embedded.mobileprovision 占位不必要，保持原样即可
          zip -qry ARTEXX-unsigned.ipa Payload
          ls -lh ARTEXX-unsigned.ipa
          unzip -l ARTEXX-unsigned.ipa | head -20

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ARTEXX-ipa
          path: ARTEXX-unsigned.ipa
          retention-days: 14

      - name: 构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
